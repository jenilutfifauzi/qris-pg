<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>qris-pg — QRIS Payment Kit</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="QRIS payment kit untuk Cloudflare Workers: static→dynamic, kode unik, polling GoBiz, callback HMAC, auto-refresh token." />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'qris-pg',
      repo: 'https://github.com/jenilutfifauzi/qris-pg',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 3,
      search: 'auto',
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            return html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, '<div class="mermaid">$1</div>');
          });
          hook.doneEach(function () {
            if (window.mermaid && document.querySelector('.mermaid')) {
              mermaid.initialize({ startOnLoad: false });
              mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</body>
</html>
